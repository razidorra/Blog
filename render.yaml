services:
  - type: web
    name: raaji-blog-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://razidorra.github.io/Blog/
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_USER_ID
        sync: false
